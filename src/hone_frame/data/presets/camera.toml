# Camera and framing (design §10.4). `camera_angle` names the matching choice of a model whose guide lists
# a camera_angle input (Qwen-Image-Edit's Multiple-Angles LoRA); other models get the words.

[[presets]]
id = "establishing"
version = 1
name = "Establishing"
description = "A very wide view that shows the whole place and where the subject is in it."
prompt = { prefix = "Establishing shot, very wide view of the whole location,", suffix = "" }
values = { camera_angle = "wide" }

[[presets]]
id = "wide"
version = 1
name = "Wide"
description = "The full figure with plenty of surroundings."
prompt = { prefix = "Wide shot, full body with the surroundings visible,", suffix = "" }
values = { camera_angle = "wide" }

[[presets]]
id = "medium"
version = 1
name = "Medium"
description = "Waist up: the subject and what they are doing."
prompt = { prefix = "Medium shot from the waist up,", suffix = "" }
values = { camera_angle = "front" }

[[presets]]
id = "close-up"
version = 1
name = "Close-up"
description = "Head and shoulders, for expression."
prompt = { prefix = "Close-up shot of the head and shoulders,", suffix = "" }
values = { camera_angle = "close_up" }

[[presets]]
id = "extreme-close-up"
version = 1
name = "Extreme close-up"
description = "A single feature fills the frame: eyes, hands, a detail."
prompt = { prefix = "Extreme close-up filling the frame,", suffix = "" }
values = { camera_angle = "close_up" }

[[presets]]
id = "detail"
version = 1
name = "Detail"
description = "A close view of one object or material detail."
prompt = { prefix = "Detail shot, close view of the object and its material,", suffix = "" }
values = { camera_angle = "close_up" }

[[presets]]
id = "front"
version = 1
name = "Front"
description = "Straight on from the front, eye level."
prompt = { prefix = "Front view, facing the camera straight on, eye level,", suffix = "" }
values = { camera_angle = "front" }

[[presets]]
id = "profile"
version = 1
name = "Profile"
description = "A side view: exactly 90 degrees from the front."
prompt = { prefix = "Side profile view, turned 90 degrees to the camera, eye level,", suffix = "" }
values = { camera_angle = "right_side" }

[[presets]]
id = "rear"
version = 1
name = "Rear"
description = "Seen from behind."
prompt = { prefix = "Rear view, seen from directly behind, eye level,", suffix = "" }
values = { camera_angle = "back" }

[[presets]]
id = "three-quarter"
version = 1
name = "Three-quarter"
description = "Turned 45 degrees: the classic turnaround angle between front and side."
prompt = { prefix = "Three-quarter view, turned 45 degrees from the front, eye level,", suffix = "" }
values = { camera_angle = "right_45" }

[[presets]]
id = "overhead"
version = 1
name = "Overhead"
description = "Looking straight down from above."
prompt = { prefix = "Overhead shot looking straight down from above,", suffix = "" }
values = { camera_angle = "high_angle" }

[[presets]]
id = "low-angle"
version = 1
name = "Low angle"
description = "The camera looks up at the subject, which makes it feel larger."
prompt = { prefix = "Low-angle shot looking up at the subject,", suffix = "" }
values = { camera_angle = "low_angle" }

[[presets]]
id = "reverse"
version = 1
name = "Reverse angle"
description = "The opposite direction of the previous shot: what the subject is looking at."
prompt = { prefix = "Reverse angle, the camera faces the opposite direction, toward what the subject is looking at,", suffix = "" }
values = { camera_angle = "back" }

[[presets]]
id = "pov"
version = 1
name = "Point of view"
description = "What the character sees, from their eye position."
prompt = { prefix = "First-person point of view from the character's eyes, their hands may be visible,", suffix = "" }
values = {}
