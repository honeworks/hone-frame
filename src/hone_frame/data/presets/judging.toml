# Judging profiles (design §8.3). `when` names the condition under which a check applies; a check
# without `when` always applies. `required` checks gate the pick; the others only rank.

[[presets]]
id = "character-identity"
version = 5
name = "Character identity"
description = "Character reference images: is it the same person, in the requested view, expression, outfit and framing, drawn correctly?"

[[presets.values.checks]]
name = "identity"
question = "Is this the same character as the identity reference (face, hair, build, colours)?"
required = true
when = "identity_ref"
unless = "rear"

[[presets.values.checks]]
name = "identity_from_behind"
question = "Seen from behind, the face is not expected. Do the build, hair, clothing, colours and distinguishing features match the identity reference?"
required = true
when = "rear"

[[presets.values.checks]]
name = "view"
question = "Is the camera view and angle the one under 'Requested view' (front, three-quarter, side, back, close-up)?"
required = true

[[presets.values.checks]]
name = "faces_away"
question = "This is a back view: does the character face away from the camera, showing the back of the head and the back of the body, with no face visible?"
required = true
when = "rear"

[[presets.values.checks]]
name = "expression"
question = "Is the facial expression the one under 'Requested facial expression'? A neutral face when another expression was asked is a fail."
required = true
when = "expression"

[[presets.values.checks]]
name = "pose"
question = "Name the body position you see (standing, walking, running, sitting, kneeling, crouching, lying), then compare it with 'Requested pose'. A different position (standing or crouching when sitting was asked, walking when running was asked) is a fail."
required = true
when = "pose"

[[presets.values.checks]]
name = "outfit_state"
question = "Are the outfit and any requested state as described?"
required = true

[[presets.values.checks]]
name = "framing"
question = "Is the framing as requested, with nothing important cropped?"
required = true

[[presets.values.checks]]
name = "anatomy"
question = "Look closely at each hand and each foot, then the limbs and face. Fail if a hand has the wrong number of fingers, if a foot is missing, extra, merged or twisted, if the feet point a way the body could not stand (in a side view both feet point the same way as the face), or if any limb, joint or the face is distorted."
required = true

[[presets.values.checks]]
name = "clean_background"
question = "Is the background plain white, with no scenery, floor, furniture, props or other figures?"
required = true
when = "clean_background"

[[presets.values.checks]]
name = "no_props"
question = "Are the hands empty: no weapon, tool, bag or other object held or carried?"
required = true
when = "no_props"

[[presets.values.checks]]
name = "solo"
question = "Is the character the only person in the picture, with nobody else in it?"
required = true
when = "solo"

[[presets.values.checks]]
name = "style"
question = "Does it match the requested art style?"
required = false

[[presets]]
id = "environment-continuity"
version = 2
name = "Environment continuity"
description = "Environment images: right viewpoint, the place's anchors and recurring objects where they belong, materials and light."

[[presets.values.checks]]
name = "viewpoint"
question = "Is the viewpoint the one requested?"
required = true

[[presets.values.checks]]
name = "anchors"
question = "Are the place's spatial anchors visible and consistent with the description and the reference?"
required = true
when = "anchors"

[[presets.values.checks]]
name = "recurring_objects"
question = "Are the recurring objects present and where they belong?"
required = true
when = "recurring"

[[presets.values.checks]]
name = "materials"
question = "Do the materials match the description?"
required = true

[[presets.values.checks]]
name = "lighting"
question = "Is the lighting the one requested?"
required = true

[[presets.values.checks]]
name = "no_people"
question = "Is the place empty, with no people or animals in it?"
required = true
when = "empty_place"

[[presets.values.checks]]
name = "style"
question = "Does it match the requested art style?"
required = false

[[presets]]
id = "object-fidelity"
version = 3
name = "Object fidelity"
description = "Object images: shape, distinctive details, material, the requested view and state."

[[presets.values.checks]]
name = "identity"
question = "Is this the same object as the reference (shape, colour, details)?"
required = true
when = "identity_ref"

[[presets.values.checks]]
name = "shape"
question = "Does the shape match the description?"
required = true

[[presets.values.checks]]
name = "details"
question = "Are the distinctive details present?"
required = true

[[presets.values.checks]]
name = "material"
question = "Does the material and colour match?"
required = true

[[presets.values.checks]]
name = "view_state"
question = "Is the view and the requested state as asked?"
required = true

[[presets.values.checks]]
name = "scale_cues"
question = "Do the scale cues make sense?"
required = false

[[presets.values.checks]]
name = "object_alone"
question = "Is the object shown alone, with no person, hands, horse rider or anyone holding, wearing or using it?"
required = true
when = "object_alone"

[[presets.values.checks]]
name = "clean_background"
question = "Is the background plain white, with no scenery, floor, furniture, props or other figures?"
required = true
when = "clean_background"

[[presets.values.checks]]
name = "style"
question = "Does it match the requested art style?"
required = false

[[presets]]
id = "interaction-plausibility"
version = 3
name = "Interaction plausibility"
description = "A character using an object: identity of both, believable contact, hands and orientation."

[[presets.values.checks]]
name = "identity"
question = "Is the character the same as the identity reference?"
required = true
when = "identity_ref"

[[presets.values.checks]]
name = "object"
question = "Is the object the same as the object reference?"
required = true
when = "object_ref"

[[presets.values.checks]]
name = "contact"
question = "Is the contact between the character and the object believable (touching where it should, nothing passing through)?"
required = true

[[presets.values.checks]]
name = "hand_placement"
question = "Are the hands placed correctly on the object, with correct fingers?"
required = true

[[presets.values.checks]]
name = "object_orientation"
question = "Is the object oriented the way it is used?"
required = true

[[presets.values.checks]]
name = "scale"
question = "Is the object's size right relative to the character?"
required = true

[[presets.values.checks]]
name = "anatomy"
question = "Look closely at each hand and each foot, then the limbs and face. Fail if a hand has the wrong number of fingers, if a foot is missing, extra, merged or twisted, if the feet point a way the body could not stand (in a side view both feet point the same way as the face), or if any limb, joint or the face is distorted."
required = true

[[presets.values.checks]]
