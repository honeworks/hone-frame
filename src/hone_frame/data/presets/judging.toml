[[presets]]
id = "sequence-continuity"
version = 2
name = "Sequence continuity"
description = "A sequence frame: the scene checks, plus continuity with the previous frame and the intended change."

[[presets.values.checks]]
name = "subject_presence"
question = "Are all the requested subjects present?"
required = true

[[presets.values.checks]]
name = "identity"
question = "Is the character the same as the identity reference?"
required = true
when = "identity_ref"

[[presets.values.checks]]
name = "action"
question = "Is the frame's action or change the one described?"
required = true

[[presets.values.checks]]
name = "continuity"
question = "Apart from the intended change, does it continue the previous frame (same place, clothes, objects, light)?"
required = true
when = "previous"

[[presets.values.checks]]
name = "state_progression"
question = "Is the resulting state the one this frame should end in?"
required = true
when = "state"

[[presets.values.checks]]
name = "anatomy"
question = "Look closely at every visible hand and foot, then the limbs and faces. Fail if a hand has the wrong number of fingers, a foot is missing, extra, merged or twisted, feet point a way the body could not stand, or a limb, joint or face is distorted."
required = true
when = "character"

[[presets.values.checks]]
name = "style"
question = "Does it match the requested art style?"
required = false

[[presets]]
id = "pose-reference"
version = 1
name = "Pose reference"
description = "A pose-library mannequin (change 0005): the requested pose, the whole figure, a plain mannequin, a white background."

[[presets.values.checks]]
name = "pose"
question = "Name the body position the mannequin is in, then compare it with 'Requested pose'. A different position is a fail."
required = true

[[presets.values.checks]]
name = "whole_figure"
question = "Is the whole mannequin visible from head to feet, nothing cropped?"
required = true

[[presets.values.checks]]
name = "plain_mannequin"
question = "Is it a plain wooden artist's mannequin with no face, hair or clothes (not a person)?"
required = true

[[presets.values.checks]]
name = "clean_background"
question = "Is the background plain white, with no scenery, floor or other objects (a stool the pose sits on is fine)?"
required = true
when = "clean_background"

