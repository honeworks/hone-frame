# Poses and actions (design §5.1, §10.4). Pose conditioning is used only when a model supports it.

[[presets]]
id = "neutral-standing"
version = 1
name = "Neutral standing"
description = "Standing upright, arms relaxed slightly away from the body."
subject_kinds = ["character"]
prompt = { prefix = "", suffix = "standing upright in a relaxed neutral pose, arms slightly away from the body, full figure visible" }

